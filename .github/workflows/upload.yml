name: Yummy Foodie — Bulk Upload to ShortSync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'   # Auto re-run every 5 hours to finish remaining uploads

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download state from previous run (skip already-done files)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: upload.yml
          name: upload-state
          path: .
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: Show state
        run: |
          if [ -f upload_state.json ]; then
            echo "State file found:"
            python3 -c "import json; s=json.load(open('upload_state.json')); print(f'Already done: {len(s[\"done\"])} files')"
          else
            echo "No state file — fresh start"
          fi

      - name: Run uploader
        env:
          SHORTSYNC_API_KEY:       ${{ secrets.SHORTSYNC_API_KEY }}
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          SNAPCHAT_CONNECTION_ID:  ${{ secrets.SNAPCHAT_CONNECTION_ID }}
          GOOGLE_TOKEN_JSON:       ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: python upload_to_shortsync.py

      - name: Save state artifact for next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-state
          path: upload_state.json
          overwrite: true
          retention-days: 30
